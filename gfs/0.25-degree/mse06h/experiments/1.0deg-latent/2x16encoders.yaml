defaults:
- data: zarr
- dataloader: native_grid
- datamodule: single
- diagnostics: evaluation
- hardware: slurm
- graph: encoder_decoder_only
- model: transformer
- training: default
- _self_

config_validation: True

data:
  forcing:
    - cos_latitude
    - sin_latitude
    - cos_longitude
    - sin_longitude
    - cos_julian_day
    - sin_julian_day
    - cos_local_time
    - sin_local_time
    - insolation
    - lsm
    - orog
  diagnostic:
    - accum_tp
    - u80
    - v80
  normalizer:
    default: mean-std
    std:
      - accum_tp
      - sh2
      - q_100
      - q_150
      - q_200
      - q_250
      - q_300
      - q_400
      - q_500
      - q_600
      - q_700
      - q_850
      - q_925
      - q_1000
    max:
      - orog
    none:
      - cos_latitude
      - sin_latitude
      - cos_longitude
      - sin_longitude
      - cos_julian_day
      - sin_julian_day
      - cos_local_time
      - sin_local_time
      - insolation
      - lsm

dataloader:
  batch_size:
    training: 1
    validation: 1
    test: 1
  num_workers:
    training: 4
    validation: 4
    test: 1
  limit_batches:
    training: null
    validation: null
    test: 1
  dataset: ${hardware.paths.data}/${hardware.files.global_dataset}
  training:
    start: 2015-02-01
    end: 2023-01-31
  validation:
    start: 2023-02-01
    end: 2024-01-31
  test:
    start: 2023-02-01
    end: 2024-01-31

diagnostics:
  checkpoint:
    every_n_minutes:
      save_frequency: null
      num_models_saved: 0
    every_n_epochs:
      save_frequency: 10
      num_models_saved: -1
  log:
    wandb:
      enabled: False
      entity: null
    mlflow:
      enabled: True
      offline: True
      authentication: False
      log_model: False
      tracking_uri: null
      experiment_name: 'gfs-quarter-degree'
      project_name: 'anemoi-house'
      use_azure: False
      system: True
      terminal: True
      run_name: latlon-steps030k-2encoders
      on_resume_create_child: True
      expand_hyperparams: # Which keys in hyperparams to expand
        - config
      http_max_retries: 35
  plot:
    frequency:
      batch: 300_000
      epoch: 300
    parameters: []
    precip_and_related_fields: []
    callbacks: []

graph:
  overwrite: False
  data: "data"
  hidden: "hidden"
  nodes:
    data:
      node_builder:
        _target_: anemoi.graphs.nodes.AnemoiDatasetNodes
        dataset: ${dataloader.dataset}
      attributes: ${graph.attributes.nodes}
    middle:
      node_builder:
        _target_: anemoi.graphs.nodes.NPZFileNodes
        npz_file: ${hardware.paths.graph}/${hardware.files.middle_npz_file}
        lat_key: lat
        lon_key: lon
    hidden:
      node_builder:
        _target_: anemoi.graphs.nodes.NPZFileNodes
        npz_file: ${hardware.paths.graph}/${hardware.files.hidden_npz_file}
        lat_key: lat
        lon_key: lon
  edges:
  # Encoder 1 configuration
  - source_name: ${graph.data}
    target_name: middle
    edge_builders:
    - _target_: anemoi.graphs.edges.KNNEdges
      num_nearest_neighbours: 4
      source_mask_attr_name: null
      target_mask_attr_name: null
    attributes: ${graph.attributes.edges}
  # Encoder 2 configuration
  - source_name: middle
    target_name: ${graph.hidden}
    edge_builders:
    - _target_: anemoi.graphs.edges.KNNEdges
      num_nearest_neighbours: 4
      source_mask_attr_name: null
      target_mask_attr_name: null
    attributes: ${graph.attributes.edges}
  # Decoder configuration
  - source_name: ${graph.hidden}
    target_name: ${graph.data}
    edge_builders:
    - _target_: anemoi.graphs.edges.KNNEdges
      num_nearest_neighbours: 3
      source_mask_attr_name: null
      target_mask_attr_name: null
    attributes: ${graph.attributes.edges}
  attributes:
    nodes:
      area_weight:
        _target_: anemoi.graphs.nodes.attributes.SphericalAreaWeights
        norm: unit-max
        fill_value: 0
    edges:
      edge_length:
        _target_: anemoi.graphs.edges.attributes.EdgeLength
        norm: unit-max
      edge_dirs:
        _target_: anemoi.graphs.edges.attributes.EdgeDirection
        norm: unit-std

hardware:
  num_gpus_per_model: 4
  paths:
    data: ${oc.decode:${oc.env:SCRATCH}}/anemoi-house/gfs/0.25-degree/data
    graph: ${oc.decode:${oc.env:SCRATCH}}/anemoi-house/gfs/0.25-degree/mesh-gen/1.0deg-latent/
    output: ${oc.decode:${oc.env:SCRATCH}}/anemoi-house/gfs/0.25-degree/mse06h/experiments/1.0deg-latent/2x16encoders/
  files:
    graph: graph.2encoders.pt
    middle_npz_file: latent.stage1.global_quarter_degree.sorted.npz
    hidden_npz_file: latent.stage2.global_quarter_degree.sorted.npz
    global_dataset: gfs.zarr

model:
  model:
    _target_: anemoi.models.models.AnemoiModelMultiEncProcDec
  num_channels: 512
  processor:
    window_size: 4320
  bounding:
    - _target_: anemoi.models.layers.bounding.ReluBounding #[0, infinity)
      variables:
      - accum_tp
      - sh2
      - q_100
      - q_150
      - q_200
      - q_250
      - q_300
      - q_400
      - q_500
      - q_600
      - q_700
      - q_850
      - q_925
      - q_1000

training:
  run_id: cb9f522d8d5b4967a0105c694401e123
  max_steps: 30_000
  # LR = local_rate * num_gpus_per_node * num_nodes / gpus_per_model
  #    = local_rate * total_gpus / gpus_per_model
  lr:
    warmup: 1000
    rate: 0.625e-4
    iterations: ${training.max_steps}
    min: 3e-7
  variable_groups:
    default: sfc
    pl:
      param: [gh, u, v, w, t, q]
  metrics:
    - gh_500
    - t_850
    - u_850
    - v_850
  training_loss:
    _target_: anemoi.training.losses.MSELoss
    scalers: ["general_variable", "nan_mask_weights", "node_weights"]
    ignore_nans: False
  scalers:
    general_variable:
      _target_: anemoi.training.losses.scalers.GeneralVariableLossScaler
      weights:
        default: 1
        q: 0.6 #1
        t: 6   #1
        u: 0.8 #0.5
        v: 0.5 #0.33
        w: 0.001
        gh: 12  #1
        sp: 10
        u10: 0.1
        v10: 0.1
        accum_tp: 0.025
